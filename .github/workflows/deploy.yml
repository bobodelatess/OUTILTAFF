# Publie CADENCE sur GitHub Pages à chaque push.
# Côté GitHub : Settings → Pages → Source = "GitHub Actions" (une seule fois).
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/compassionate-newton-5l4tvt
      - main
  workflow_dispatch:

# Droits requis par le déploiement Pages officiel.
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
